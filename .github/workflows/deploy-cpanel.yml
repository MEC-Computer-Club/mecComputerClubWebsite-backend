name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Compile TypeScript
        run: npm run build

      - name: 🔄 Prepare Passenger Restart Flag
        run: mkdir -p tmp && date +%s > tmp/restart.txt

      - name: 🚀 Deploy via SFTP/FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: /apps/backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/**
            .env
            .env.example
            tsConfig.json

      - name: 🔄 Trigger cPanel Application Restart
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ secrets.CPANEL_SSH_HOST != '' }}
        with:
          host: ${{ secrets.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USER }}
          password: ${{ secrets.CPANEL_SSH_PASSWORD }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd /home/meccompu/apps/backend
            mkdir -p tmp && touch tmp/restart.txt
